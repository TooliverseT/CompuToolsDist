<!-- 404.html -->
<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Page Redirect</title>
    <script>
        (function() {
            const validRoutes = ['/', '/blog', '/about/', '/contact/', '/privacy/', '/terms/', '/unix-timestamp/', '/quaternion/', '/crc/', '/ascii/', '/json/', '/base64/', '/base/', '/file-hash/', '/html/', '/url/', '/uuid/', '/text-case/', '/password/', '/base32/', '/regex/', '/color-converter/', '/unit-converter/', '/format-converter/', '/jwt/', '/diff/', '/markdown/', '/xml/', '/qrcode/', '/http-code-gen/', '/otp/', '/elapsed-time/', '/cron/', '/timestamp-log/', '/time-calculator/', '/tls-analyzer/', '/rotation-visualizer/', '/blog/2025-12-23-introducing-computools/', '/blog/2025-12-27-crc/', '/blog/2026-01-31-3d-rotation/', '/blog/2026-02-05-number-base/', '/blog/2026-02-10-ascii-converter/', '/blog/2026-02-21-unix-timestamp/', '/blog/2026-02-25-cron/', '/blog/2026-03-01-base32/', '/blog/2026-03-04-base64/', '/blog/2026-03-04-endian/', '/blog/2026-03-07-gimbal-lock/', '/blog/2026-03-14-cron-expression/', '/blog/2026-03-15-crc-comparison/'];
            
            const segment = window.location.pathname;
            
            function createMetaTag(path) {
                const meta = document.createElement('meta');
                meta.setAttribute('http-equiv', 'refresh');
                meta.setAttribute('content', `0; url=${path}`);
                document.getElementsByTagName('head')[0].appendChild(meta);
            }
            
            if (validRoutes.includes(segment)) {
                createMetaTag(segment);
            } else {
                createMetaTag('/');
            }
            
            // 현재 URL을 세션 스토리지에 저장 (클라이언트 사이드 라우팅용)
            sessionStorage.redirect = window.location.href;
        })();
    </script>
</head>
<body>
    <h1>404 - Page Not Found</h1>
    <p>The page you're looking for doesn't exist.</p>
    <a href="/">Go to Home</a>
</body>
</html>
